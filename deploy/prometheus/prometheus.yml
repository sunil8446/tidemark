global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda-0:9644", "redpanda-1:9644", "redpanda-2:9644"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  # Week 1: the Go ingestor runs on the host during development.
  - job_name: ingest
    static_configs:
      - targets: ["host.docker.internal:9102"]
        labels: { component: ingest }
