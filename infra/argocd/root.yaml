# App of apps. Apply once after installing ArgoCD:
#   kubectl apply -n argocd -f infra/argocd/root.yaml
# Every other component is an Application under infra/argocd/apps, synced
# automatically from Git (github.com/sunil8446/tidemark). The S3 bucket names
# in the Helm values (REPLACE_ME-lake, REPLACE_ME-checkpoints) come from the
# Terraform outputs once the AWS environment exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tidemark-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sunil8446/tidemark.git
    targetRevision: main
    path: infra/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
