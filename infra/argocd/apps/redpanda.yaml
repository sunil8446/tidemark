apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.redpanda.com
      chart: redpanda
      targetRevision: 25.1.1
      helm:
        valueFiles: [$values/infra/helm/values/redpanda.yaml]
    - repoURL: https://github.com/REPLACE_ME/tidemark.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: redpanda
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
