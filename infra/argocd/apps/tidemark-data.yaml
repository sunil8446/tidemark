apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tidemark-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/sunil8446/tidemark.git
    targetRevision: main
    path: infra/k8s/data
  destination:
    server: https://kubernetes.default.svc
    namespace: tidemark
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
