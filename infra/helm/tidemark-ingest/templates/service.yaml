apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "ingest.labels" . | nindent 4 }}
spec:
  selector: {{- include "ingest.selector" . | nindent 4 }}
  ports:
    - { name: metrics, port: 9102, targetPort: metrics }
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "ingest.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "ingest.selector" . | nindent 6 }}
  endpoints:
    - { port: metrics, interval: 15s }
{{- end }}
---
{{- if .Values.recording.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-recordings
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.recording.size }} } }
{{- end }}
