serviceAccount:
  create: true
  name: trino
  annotations: {} # eks.amazonaws.com/role-arn: <module.roles.role_arns["trino"]>
server:
  workers: 1
catalogs:
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=jdbc
    iceberg.jdbc-catalog.catalog-name=tidemark
    iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
    iceberg.jdbc-catalog.connection-url=jdbc:postgresql://tidemark-pg-rw.tidemark.svc.cluster.local:5432/iceberg_catalog
    iceberg.jdbc-catalog.connection-user=${ENV:PG_USER}
    iceberg.jdbc-catalog.connection-password=${ENV:PG_PASSWORD}
    iceberg.jdbc-catalog.default-warehouse-dir=s3://REPLACE_ME-lake/warehouse
    fs.native-s3.enabled=true
    s3.region=us-east-1
envFrom:
  - secretRef: { name: tidemark-pg-app-env }
