syntax = "proto3";

package tidemark.v1;

option go_package = "tidemark/gen/go/tidemark/v1;tidemarkv1";
option java_multiple_files = true;
option java_package = "dev.tidemark.proto.v1";

// Evolution rules (registry compatibility = BACKWARD):
//   * never renumber or reuse a field number; reserve removed ones
//   * new fields are optional by construction in proto3
//   * enum value 0 is always UNSPECIFIED

enum Venue {
  VENUE_UNSPECIFIED = 0;
  VENUE_COINBASE = 1;
  VENUE_KRAKEN = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_WS = 1;      // live WebSocket
  SOURCE_REST = 2;    // REST backfill after a detected gap
  SOURCE_REPLAY = 3;  // replay harness
}

// One executed trade. Topic trades.v1, key "venue:product_id".
message Trade {
  Venue venue = 1;
  string product_id = 2;   // normalised, e.g. "BTC-USD"
  uint64 trade_id = 3;     // venue sequence, increasing per product
  string price = 4;        // exact decimal text
  string size = 5;         // exact decimal text
  Side taker_side = 6;     // normalised: Coinbase reports maker side, Kraken taker side
  int64 event_ts_ns = 7;   // exchange timestamp, unix nanos
  int64 recv_ts_ns = 8;    // when the ingestor received it
  Source source = 9;
  string ingest_id = 10;   // ingestor instance that produced it
  bool from_snapshot = 11; // replayed by the venue on subscribe (Kraken snapshot, Coinbase last_match), not live
  uint64 venue_sequence = 12; // added in the Week 2 schema-evolution drill: Coinbase feed sequence; 0 if none
  // Synthetic only. Public feeds carry no trader identity; the injection
  // framework assigns accounts so the wash-trade detector can be evaluated.
  string buyer_account = 13;
  string seller_account = 14;
}

message BookLevel {
  string price = 1;
  string qty = 2;          // "0" removes the level
}

// Order book snapshot or incremental update. Topic book.v1, key "venue:product_id".
message BookUpdate {
  Venue venue = 1;
  string product_id = 2;
  bool is_snapshot = 3;
  repeated BookLevel bids = 4;
  repeated BookLevel asks = 5;
  uint32 checksum = 6;     // venue-supplied CRC32 (Kraken)
  bool checksum_ok = 7;    // validated by the ingestor against its local book
  int64 event_ts_ns = 8;
  int64 recv_ts_ns = 9;
  uint64 seq = 10;         // per-product ingestor sequence, for ordering checks
  Source source = 11;
}

enum GapKind {
  GAP_KIND_UNSPECIFIED = 0;
  GAP_KIND_TRADE_ID_JUMP = 1;       // trade_id skipped forward
  GAP_KIND_HEARTBEAT_AHEAD = 2;     // heartbeat last_trade_id beyond what we've seen
  GAP_KIND_CHECKSUM_MISMATCH = 3;   // local book diverged from venue checksum
}

enum GapStatus {
  GAP_STATUS_UNSPECIFIED = 0;
  GAP_STATUS_DETECTED = 1;
  GAP_STATUS_RECOVERED = 2;
  GAP_STATUS_UNRECOVERABLE = 3;
  GAP_STATUS_ABSENT_AT_SOURCE = 4;  // REST has moved past the range and the ids are not there
}

// Lifecycle of one gap. Topic gaps.v1, key "venue:product_id".
// A gap emits DETECTED, then exactly one terminal status with the same gap_id.
message GapEvent {
  string gap_id = 1;
  Venue venue = 2;
  string product_id = 3;
  GapKind kind = 4;
  GapStatus status = 5;
  uint64 first_missing_trade_id = 6;  // inclusive
  uint64 last_missing_trade_id = 7;   // inclusive
  uint64 recovered_count = 8;
  int64 detected_ts_ns = 9;
  int64 resolved_ts_ns = 10;
  string detail = 11;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
}

// One detector firing. Topic alerts.v1, key "venue:product_id".
// alert_id is deterministic (detector, venue, product, window start), so a
// replayed firing upserts instead of duplicating.
message Alert {
  string alert_id = 1;
  string detector = 2;           // volume_spike | spoof_layering | dislocation | wash_trade
  Venue venue = 3;               // VENUE_UNSPECIFIED for cross-venue alerts
  string product_id = 4;
  int64 event_ts_ns = 5;         // event time at which the detector fired
  int64 window_start_ns = 6;     // evidence window: query trades/book in [start, end]
  int64 window_end_ns = 7;
  double score = 8;              // detector-specific (z-score, size multiple, ...)
  double threshold = 9;          // threshold in force when it fired
  Severity severity = 10;
  string summary = 11;           // one human-readable line
  map<string, string> evidence = 12;
  int64 emitted_ts_ns = 13;      // processing time, for alert-latency SLOs
}

// Ground truth for one injected pattern. Topic labels.v1, key "venue:product_id".
message InjectionLabel {
  string injection_id = 1;
  string pattern = 2;            // same vocabulary as Alert.detector
  Venue venue = 3;
  string product_id = 4;
  int64 start_ts_ns = 5;
  int64 end_ts_ns = 6;
  map<string, string> params = 7;
}
