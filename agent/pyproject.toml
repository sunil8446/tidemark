[project]
name = "tidemark-agent"
version = "0.4.0"
description = "LangGraph alert investigator for Tidemark (Claude + read-only MCP tools)"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=0.70",
    "langgraph>=0.6",
    "pydantic>=2.8",
    "tidemark-mcp",
]

[tool.uv.sources]
tidemark-mcp = { path = "../mcp-server", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tidemark-investigate = "investigator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["investigator"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
